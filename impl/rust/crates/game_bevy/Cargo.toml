[package]
name = "game_bevy"
description = "Bevy front end: rendering, input, UI and audio on top of the sim crates."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ultra_space"
path = "src/main.rs"

[dependencies]
bevy.workspace = true
glam.workspace = true
sim_core.workspace = true
sim_planet.workspace = true
sim_vehicle.workspace = true
sim_society.workspace = true
ai_gateway.workspace = true
serde.workspace = true
serde_json.workspace = true
# Reads the part models (glTF binaries); no image import.
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }

[lints]
workspace = true

[features]
# Writes a Chrome trace (every system's span, per frame) to trace-<time>.json in the working
# directory, or to $TRACE_CHROME: `ULTRA_SPACE_FEATURES=trace tools/export-windows.sh`, then open
# it in https://ui.perfetto.dev. For finding hitches; slows the game a little.
trace = ["bevy/trace_chrome"]
