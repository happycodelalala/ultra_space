[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
sim_core = { path = "crates/sim_core" }
sim_planet = { path = "crates/sim_planet" }
sim_vehicle = { path = "crates/sim_vehicle" }
sim_economy = { path = "crates/sim_economy" }
sim_combat = { path = "crates/sim_combat" }
ai_gateway = { path = "crates/ai_gateway" }
sim_society = { path = "crates/sim_society" }

# Engine (pinned; upgrade deliberately between batches, never mid-batch)
bevy = "=0.20.1"
# Standalone ECS for engine-independent sim crates (same version as bevy)
bevy_ecs = { version = "=0.20.1", features = ["multi_threaded"] }
bevy_tasks = { version = "=0.20.1", features = ["multi_threaded"] }
glam = "0.33"
# Simulation physics (Batch 3); newer than most training data: read its source before use.
rapier3d-f64 = "=0.36.1"

# Content data (engine-neutral JSON)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy's recommended dev setup: our code builds fast, dependencies run fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
